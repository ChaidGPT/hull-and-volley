<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <rect width="960" height="720" fill="#080f12"/>
  <text x="50" y="54" fill="#bffdf4" font-family="monospace" font-size="26">STANDARD ROOM — 160 × 160 PX</text>
  <text x="50" y="84" fill="#779b9f" font-family="monospace" font-size="16">10 × 10 GRID  •  EACH SQUARE = 16 × 16 PX  •  ART STOPS AT THE CANVAS EDGE</text>

  <g transform="translate(50 110) scale(3.25)" shape-rendering="crispEdges">
    <rect width="160" height="160" fill="#10171b"/>
    <rect x="16" y="16" width="128" height="128" fill="#7894a0"/>
    <rect x="16" y="0" width="128" height="16" fill="#5b6172"/>
    <rect x="144" y="16" width="16" height="128" fill="#6c526f"/>
    <rect x="16" y="144" width="128" height="16" fill="#5b6172"/>
    <rect x="0" y="16" width="16" height="128" fill="#6c526f"/>
    <rect x="0" y="0" width="16" height="16" fill="#d49a35"/>
    <rect x="144" y="0" width="16" height="16" fill="#d49a35"/>
    <rect x="144" y="144" width="16" height="16" fill="#d49a35"/>
    <rect x="0" y="144" width="16" height="16" fill="#d49a35"/>
    <rect x="64" y="0" width="32" height="16" fill="#25e7d0"/>
    <rect x="144" y="64" width="16" height="32" fill="#25e7d0"/>
    <rect x="64" y="144" width="32" height="16" fill="#25e7d0"/>
    <rect x="0" y="64" width="16" height="32" fill="#25e7d0"/>
    <g fill="none" stroke="#172b78" stroke-width="0.5">
      <path d="M16 0V160 M32 0V160 M48 0V160 M64 0V160 M80 0V160 M96 0V160 M112 0V160 M128 0V160 M144 0V160"/>
      <path d="M0 16H160 M0 32H160 M0 48H160 M0 64H160 M0 80H160 M0 96H160 M0 112H160 M0 128H160 M0 144H160"/>
    </g>
    <rect x="0.5" y="0.5" width="159" height="159" fill="none" stroke="#172b78" stroke-width="0.5"/>
  </g>

  <g font-family="monospace">
    <rect x="610" y="130" width="22" height="22" fill="#7894a0"/><text x="648" y="148" fill="#d8eeef" font-size="18">FLOOR — inner 128 × 128</text>
    <rect x="610" y="180" width="22" height="22" fill="#5b6172"/><text x="648" y="198" fill="#d8eeef" font-size="18">N/S HALF-WALL</text>
    <rect x="610" y="230" width="22" height="22" fill="#6c526f"/><text x="648" y="248" fill="#d8eeef" font-size="18">E/W HALF-WALL</text>
    <rect x="610" y="280" width="22" height="22" fill="#d49a35"/><text x="648" y="298" fill="#d8eeef" font-size="18">16 × 16 CORNER</text>
    <rect x="610" y="330" width="22" height="22" fill="#25e7d0"/><text x="648" y="348" fill="#d8eeef" font-size="18">32 PX DOOR SLOT</text>

    <text x="610" y="410" fill="#ffb845" font-size="18">SHARED WALL</text>
    <text x="610" y="440" fill="#a9c6c8" font-size="15">Room A owns its 16 px edge.</text>
    <text x="610" y="464" fill="#a9c6c8" font-size="15">Room B owns its 16 px edge.</text>
    <text x="610" y="488" fill="#a9c6c8" font-size="15">Together they form the seam.</text>

    <text x="610" y="550" fill="#ff7063" font-size="18">NEVER CROSS THE EDGE</text>
    <text x="610" y="580" fill="#a9c6c8" font-size="15">No neighboring-room pixels.</text>
    <text x="610" y="604" fill="#a9c6c8" font-size="15">No connector overhang.</text>
    <text x="610" y="628" fill="#a9c6c8" font-size="15">Door animation stays separate.</text>
  </g>
</svg>
